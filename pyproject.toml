[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "medical-multi-agent-system"
version = "0.1.0"
description = "A Python research prototype for a five-agent clinical workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.2,<2",
    "langgraph>=0.2,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "structlog>=24.4,<27",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.25,<7"]
plots = ["matplotlib>=3.9,<4"]
dev = ["build>=1.2,<2", "pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.urls]
Repository = "https://github.com/HenryVarro666/Medical-multi-agent-system"
Issues = "https://github.com/HenryVarro666/Medical-multi-agent-system/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_multi_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/data", "/evaluation",
    "/docs", "/README.md", "/CONTRIBUTING.md", "/ATTRIBUTION.md", "/LICENSE",
    "/pyproject.toml", "/uv.lock", "/.env.example", "/Dockerfile", "/compose.yaml",
    "/.dockerignore", "/.python-version",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
