name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev pytest
      - name: Render evaluation figures
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev --extra plots python -m evaluation.plot_results --output-dir /tmp/evaluation-charts
      - name: Render architecture diagrams
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev --extra plots python -m evaluation.draw_architecture --output-dir /tmp/architecture-diagrams
      - run: uv build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medical-multi-agent:test .
      - run: docker run --detach --name medical-api --publish 127.0.0.1:8000:8000 medical-multi-agent:test
      - run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors --connect-timeout 2 --max-time 5 http://127.0.0.1:8000/health
      - run: curl --fail http://127.0.0.1:8000/api/v1/clinical/icd10/J18.9
      - if: always()
        run: docker logs medical-api
