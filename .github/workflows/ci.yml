name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev pytest
      - name: Render evaluation figures
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev --extra plots python -m evaluation.plot_results --output-dir /tmp/evaluation-charts
      - name: Render recorded two-model comparison
        if: matrix.python-version == '3.12'
        run: >-
          uv run --locked --extra dev --extra plots python -m evaluation.plot_comparison
          --results evaluation/results/codex-comparison-2026-10-26/gpt-6.1-sol/eval_results.json
          evaluation/results/codex-comparison-2026-10-26/gpt-6-astra/eval_results.json
          --output-dir /tmp/codex-comparison-charts
      - name: Render coding-validation v2 comparison
        if: matrix.python-version == '3.12'
        run: >-
          uv run --locked --extra dev --extra plots python -m evaluation.plot_comparison
          --results evaluation/results/coding-v2-2026-10-26/gpt-6.1-sol/eval_results.json
          evaluation/results/coding-v2-2026-10-26/gpt-6-astra/eval_results.json
          --prefix coding-v2-2026-10-26 --output-dir /tmp/coding-v2-charts
      - name: Render architecture diagrams
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev --extra plots python -m evaluation.draw_architecture --output-dir /tmp/architecture-diagrams
      - name: Render archived case walkthrough
        if: matrix.python-version == '3.12'
        run: uv run --locked --extra dev --extra plots python -m evaluation.draw_case --output-dir /tmp/case-diagrams
      - run: uv build

  pip-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build --detach --wait --wait-timeout 90
      - run: curl --fail http://127.0.0.1:8000/health
      - run: curl --fail http://127.0.0.1:8000/api/v1/clinical/icd10/J18.9
      - run: curl --fail http://127.0.0.1:8000/api/v1/clinical/icd10/validate/I21.09
      - name: Check default model URL with the Compose environment
        run: >-
          docker compose exec -T -e OPENAI_API_KEY=ci-placeholder api python -c
          "from medical_multi_agent.config.llm import get_llm;
          assert str(get_llm().root_client.base_url) == 'https://api.openai.com/v1/'"
      - if: always()
        run: docker compose logs api
      - if: always()
        run: docker compose down
