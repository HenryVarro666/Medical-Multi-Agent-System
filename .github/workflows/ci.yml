name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run --locked --extra dev ruff check .
      - run: uv run --locked --extra dev pytest
      - run: uv build

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medical-multi-agent:test .
      - run: docker run --detach --name medical-api --publish 127.0.0.1:8000:8000 medical-multi-agent:test
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/health
      - run: curl --fail http://127.0.0.1:8000/api/v1/clinical/icd10/J18.9
      - if: always()
        run: docker logs medical-api
